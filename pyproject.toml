[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-sysmon"
version = "0.1.0"
description = "Run-state worker + supervisor head for Windows 11 hosts (hermes-win11-ops:sysmon)"
requires-python = ">=3.11"
dependencies = [
  "psutil>=5.9",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
sysmon = "sysmon.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["sysmon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
